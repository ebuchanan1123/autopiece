services:
  translate:
    image: libretranslate/libretranslate:latest
    ports:
      - "5001:5000"
    environment:
      LT_LOAD_ONLY: "en,fr,ar"
      LT_DISABLE_FILES_TRANSLATION: "true"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages', timeout=2).read(); print('ok')" || exit 1
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 5m

  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432" # host:container
    environment:
      POSTGRES_USER: tgtg
      POSTGRES_PASSWORD: tgtg-password
      POSTGRES_DB: tgtg_db
    volumes:
      - tgtg_db_data:/var/lib/postgresql/data
    healthcheck:      
      test: ["CMD-SHELL", "pg_isready -U tgtg -d tgtg_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: development
      PORT: 3000

      # IMPORTANT: db service name, not localhost
      DATABASE_URL: postgres://tgtg:tgtg-password@db:5432/tgtg_db
      DB_SSL: "false"

      # IMPORTANT: translate service name, not localhost
      LIBRETRANSLATE_URL: http://translate:5000
      # LIBRETRANSLATE_API_KEY: ""  # only if you ever add one
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-mock}
      SATIM_MODE: ${SATIM_MODE:-test}
      SATIM_MERCHANT_ID: ${SATIM_MERCHANT_ID:-}
      SATIM_TERMINAL_ID: ${SATIM_TERMINAL_ID:-}
      SATIM_API_KEY: ${SATIM_API_KEY:-}
      SATIM_CALLBACK_SECRET: ${SATIM_CALLBACK_SECRET:-}
      SATIM_RETURN_URL: ${SATIM_RETURN_URL:-http://localhost:3002/payments/satim/return}
      SATIM_CALLBACK_URL: ${SATIM_CALLBACK_URL:-http://localhost:3002/payments/satim/callback}

      JWT_SECRET: a7ec9a328c2eb75d39f8c2f2cf5b3c24440a82f19b7d0db25562fb60d7debec636e0dc79d5963ea072a4c7c18e37ad56
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d

      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      COOKIE_DOMAIN: ""

      # Add the actual frontend origins you use
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:19006,http://192.168.0.198:19006,http://192.168.0.198:3002
      SESSION_FINGERPRINT_SECRET: dev_fingerprint_secret_very_secure_very_long_very_secret_very_nice_very_mysterious
      SESSION_FINGERPRINT_STRICT: "false"
    depends_on:
      db:
        condition: service_healthy
      translate:
        condition: service_healthy
    command: sh -c "npm run migration:run:prod && node dist/main.js"

volumes:
  tgtg_db_data:
